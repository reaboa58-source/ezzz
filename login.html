<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 تسجيل دخول البوت</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-box {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 40px;
            width: 90%;
            max-width: 450px;
        }
        h1 { color: #00ff88; text-align: center; margin-bottom: 10px; font-size: 28px; }
        .subtitle { text-align: center; color: #888; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; color: #aaa; margin-bottom: 8px; font-weight: bold; }
        input {
            width: 100%; padding: 15px; border-radius: 10px;
            border: 2px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.3); color: #fff; font-size: 16px;
        }
        input:focus { outline: none; border-color: #00ff88; }
        .btn {
            width: 100%; padding: 15px;
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            border: none; border-radius: 10px; color: #000;
            font-size: 18px; font-weight: bold; cursor: pointer;
        }
        .btn:hover { transform: translateY(-2px); }
        .info {
            background: rgba(0,255,136,0.1);
            border-right: 3px solid #00ff88;
            padding: 15px; border-radius: 8px;
            margin-bottom: 20px; color: #ccc; font-size: 14px; line-height: 1.6;
        }
        .info a { color: #00ff88; }
        .error {
            background: rgba(255,0,0,0.1);
            border-right: 3px solid #ff4444;
            padding: 15px; border-radius: 8px;
            margin-bottom: 20px; color: #ff8888; display: none;
        }
        .loading { display: none; text-align: center; color: #00ff88; margin-top: 15px; }
        .spinner {
            display: inline-block; width: 20px; height: 20px;
            border: 2px solid #00ff88; border-top-color: transparent;
            border-radius: 50%; animation: spin 1s linear infinite;
            margin-left: 10px; vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>🤖 بوت الترحيب</h1>
        <p class="subtitle">أدخل توكن البوت للبدء</p>
        
        <div class="info">
            <strong>📍 من وين أجيب التوكن؟</strong><br>
            1. روح <a href="https://discord.com/developers/applications" target="_blank">Discord Developer Portal</a><br>
            2. اختر بوتك ← Bot ← Reset Token<br>
            3. انسخ التوكن والصقه هنا
        </div>

        <div class="error" id="errorBox"></div>

        <div class="form-group">
            <label>🔑 توكن البوت</label>
            <input type="password" id="tokenInput" placeholder="MTAxxxxxxxxxxxxxxxxxxxxxxxx">
        </div>

        <button class="btn" id="loginBtn" onclick="login()">🚀 تشغيل البوت</button>

        <div class="loading" id="loadingBox">
            <span class="spinner"></span>
            جاري التحقق من التوكن...
        </div>
    </div>

    <script>
        fetch('/api/check-token')
            .then(r => r.json())
            .then(data => { if (data.hasToken) window.location.href = '/'; });

        async function login() {
            const token = document.getElementById('tokenInput').value.trim();
            const btn = document.getElementById('loginBtn');
            const loading = document.getElementById('loadingBox');
            const errorBox = document.getElementById('errorBox');

            if (!token) { showError('❌ الرجاء إدخال التوكن'); return; }

            btn.disabled = true;
            loading.style.display = 'block';
            errorBox.style.display = 'none';

            try {
                const res = await fetch('/api/set-token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token })
                });
                const data = await res.json();

                if (res.ok) {
                    alert(`✅ البوت شغال! ${data.botTag}`);
                    window.location.href = '/';
                } else {
                    showError(data.error || '❌ خطأ غير معروف');
                }
            } catch (e) {
                showError('❌ تعذر الاتصال بالسيرفر');
            } finally {
                btn.disabled = false;
                loading.style.display = 'none';
            }
        }

        function showError(msg) {
            const errorBox = document.getElementById('errorBox');
            errorBox.textContent = msg;
            errorBox.style.display = 'block';
        }

        document.getElementById('tokenInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') login();
        });
    </script>
</body>
</html>
