<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 بوت الترحيب</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #1a1a2e;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        
        /* توكن */
        .token-card {
            background: #242444;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
        }
        .token-card h2 { color: #00ff88; margin-bottom: 15px; }
        .token-input {
            width: 100%; padding: 15px; border-radius: 10px;
            border: 2px solid #333;
            background: #1a1a2e; color: #fff;
            font-size: 16px; margin-bottom: 15px;
        }
        .token-input:focus { outline: none; border-color: #00ff88; }
        .btn-group { display: flex; gap: 10px; }
        .btn-start {
            flex: 1; padding: 15px;
            background: #00ff88; border: none;
            border-radius: 10px; color: #000;
            font-size: 16px; font-weight: bold; cursor: pointer;
        }
        .btn-start:hover { background: #00cc6a; }
        .btn-start:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-stop {
            flex: 1; padding: 15px;
            background: #ff4444; border: none;
            border-radius: 10px; color: #fff;
            font-size: 16px; font-weight: bold; cursor: pointer;
        }
        .btn-stop:hover { background: #cc3333; }
        .btn-stop:disabled { opacity: 0.5; cursor: not-allowed; }
        .status-msg { margin-top: 10px; padding: 10px; border-radius: 8px; display: none; }
        .status-msg.error { background: #ff444433; color: #ff8888; }
        .status-msg.success { background: #00ff8833; color: #00ff88; }
        .status-msg.loading { background: #333; color: #00ff88; }
        
        /* لوحة التحكم */
        .dashboard { display: none; }
        h1 { text-align: center; margin-bottom: 20px; color: #00ff88; }
        .card {
            background: #242444;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
        }
        .bot-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .bot-info { display: flex; align-items: center; gap: 15px; }
        .bot-avatar {
            width: 50px; height: 50px; border-radius: 50%;
            background: #5865f2; display: flex;
            align-items: center; justify-content: center;
            font-size: 24px;
        }
        .status { display: inline-block; padding: 5px 15px; border-radius: 20px; font-size: 14px; font-weight: bold; }
        .status.online { background: #00ff8833; color: #00ff88; }
        .status.offline { background: #ff444433; color: #ff4444; }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #aaa; font-weight: bold; }
        input, textarea {
            width: 100%; padding: 12px; border-radius: 8px;
            border: 1px solid #333;
            background: #1a1a2e; color: #fff;
            font-size: 16px; font-family: inherit;
        }
        textarea { min-height: 100px; resize: vertical; }
        .toggle-switch { display: flex; align-items: center; gap: 15px; }
        .switch {
            position: relative; width: 60px; height: 30px;
            background: #444; border-radius: 15px; cursor: pointer; transition: 0.3s;
        }
        .switch.active { background: #00ff88; }
        .switch::after {
            content: ''; position: absolute; width: 26px; height: 26px;
            background: #fff; border-radius: 50%; top: 2px; right: 2px; transition: 0.3s;
        }
        .switch.active::after { right: 32px; }
        .btn-save {
            width: 100%; padding: 15px;
            background: #00ff88; border: none;
            border-radius: 10px; color: #000;
            font-size: 18px; font-weight: bold; cursor: pointer;
        }
        .btn-save:hover { background: #00cc6a; }
        .preview-box {
            background: #36393f; border-radius: 10px;
            padding: 15px; margin-top: 15px;
            border-right: 4px solid #00ff88;
        }
        .preview-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: #5865f2; }
        .preview-content { color: #dcddde; line-height: 1.5; }
        .variables {
            background: rgba(0,255,136,0.1); border-radius: 8px;
            padding: 15px; margin-top: 15px; font-size: 14px;
        }
        .variables code {
            background: #1a1a2e; padding: 2px 8px;
            border-radius: 4px; color: #00ff88;
        }
        .toast {
            position: fixed; top: 20px; left: 50%;
            transform: translateX(-50%); background: #00ff88;
            color: #000; padding: 15px 30px; border-radius: 10px;
            font-weight: bold; opacity: 0; transition: 0.3s; z-index: 1000;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- توكن -->
        <div class="token-card" id="tokenCard">
            <h2>🔑 توكن البوت</h2>
            <input type="password" id="tokenInput" placeholder="اكتب التوكن هنا...">
            <div class="btn-group">
                <button class="btn-start" id="startBtn" onclick="startBot()">▶️ تشغيل</button>
                <button class="btn-stop" id="stopBtn" onclick="stopBot()" disabled>⏹️ إيقاف</button>
            </div>
            <div class="status-msg" id="statusMsg"></div>
        </div>

        <!-- لوحة التحكم -->
        <div class="dashboard" id="dashboard">
            <h1>⚙️ لوحة تحكم بوت الترحيب</h1>
            
            <div class="card">
                <div class="bot-header">
                    <div class="bot-info">
                        <div class="bot-avatar">🤖</div>
                        <div>
                            <h3 id="botName">...</h3>
                            <p>الحالة: <span class="status online" id="botStatus">🟢 شغال</span></p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card">
                <h3>⚙️ إعدادات الترحيب</h3>
                
                <div class="form-group">
                    <label>تفعيل/تعطيل الترحيب</label>
                    <div class="toggle-switch">
                        <div class="switch active" id="toggleSwitch" onclick="toggleWelcome()"></div>
                        <span id="toggleText">مفعل</span>
                    </div>
                </div>

                <div class="form-group">
                    <label>ايدي روم الترحيب</label>
                    <input type="text" id="channelId" placeholder="1234567890123456789">
                </div>

                <div class="form-group">
                    <label>رسالة الترحيب</label>
                    <textarea id="welcomeMsg">👋 أهلاً وسهلاً {user} بسيرفرنا!</textarea>
                    
                    <div class="variables">
                        <strong>المتغيرات المتاحة:</strong><br>
                        <code>{user}</code> - منشن العضو |
                        <code>{username}</code> - اسم المستخدم |
                        <code>{server}</code> - اسم السيرفر |
                        <code>{count}</code> - عدد الأعضاء
                    </div>
                </div>

                <div class="form-group">
                    <label>رابط صورة خلفية (اختياري)</label>
                    <input type="text" id="welcomeImage" placeholder="https://example.com/image.png">
                </div>

                <button class="btn-save" onclick="saveConfig()">💾 حفظ الإعدادات</button>
            </div>

            <div class="card">
                <h3>👁️ معاينة الرسالة</h3>
                <div class="preview-box">
                    <div class="preview-header">
                        <div class="avatar"></div>
                        <div>
                            <div style="color: #fff; font-weight: bold;">بوت الترحيب</div>
                            <div style="color: #72767d; font-size: 12px;">الآن</div>
                        </div>
                    </div>
                    <div class="preview-content" id="previewText">👋 أهلاً وسهلاً @User بسيرفرنا!</div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let currentConfig = {};

        function showStatus(msg, type) {
            const status = document.getElementById('statusMsg');
            status.textContent = msg;
            status.className = 'status-msg ' + type;
            status.style.display = 'block';
        }

        function hideStatus() {
            document.getElementById('statusMsg').style.display = 'none';
        }

        async function startBot() {
            const token = document.getElementById('tokenInput').value.trim();
            const startBtn = document.getElementById('startBtn');
            const stopBtn = document.getElementById('stopBtn');

            if (!token) {
                showStatus('❌ اكتب التوكن!', 'error');
                return;
            }

            startBtn.disabled = true;
            showStatus('⏳ جاري التشغيل...', 'loading');

            try {
                const res = await fetch('/api/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token })
                });

                const data = await res.json();

                if (res.ok) {
                    showStatus('✅ البوت شغال!', 'success');
                    stopBtn.disabled = false;
                    document.getElementById('dashboard').style.display = 'block';
                    document.getElementById('botName').textContent = data.botTag;
                    loadConfig();
                } else {
                    showStatus(data.error || '❌ خطأ', 'error');
                    startBtn.disabled = false;
                }
            } catch (e) {
                showStatus('❌ ما قدرت اتصل بالسيرفر', 'error');
                startBtn.disabled = false;
            }
        }

        async function stopBot() {
            const startBtn = document.getElementById('startBtn');
            const stopBtn = document.getElementById('stopBtn');

            stopBtn.disabled = true;
            showStatus('⏳ جاري الإيقاف...', 'loading');

            try {
                const res = await fetch('/api/stop', { method: 'POST' });
                const data = await res.json();

                if (res.ok) {
                    showStatus('⏹️ البوت متوقف', 'success');
                    startBtn.disabled = false;
                    document.getElementById('dashboard').style.display = 'none';
                } else {
                    showStatus(data.error || '❌ خطأ', 'error');
                    stopBtn.disabled = false;
                }
            } catch (e) {
                showStatus('❌ خطأ', 'error');
                stopBtn.disabled = false;
            }
        }

        async function loadConfig() {
            try {
                const res = await fetch('/api/config');
                currentConfig = await res.json();
                document.getElementById('channelId').value = currentConfig.welcomeChannelId || '';
                document.getElementById('welcomeMsg').value = currentConfig.welcomeMessage || '';
                document.getElementById('welcomeImage').value = currentConfig.welcomeImage || '';
                updateToggle(currentConfig.welcomeEnabled);
                updatePreview();
            } catch (e) { console.error(e); }
        }

        function updateToggle(enabled) {
            const switchEl = document.getElementById('toggleSwitch');
            const textEl = document.getElementById('toggleText');
            if (enabled) {
                switchEl.classList.add('active');
                textEl.textContent = 'مفعل';
            } else {
                switchEl.classList.remove('active');
                textEl.textContent = 'معطل';
            }
        }

        function toggleWelcome() {
            currentConfig.welcomeEnabled = !currentConfig.welcomeEnabled;
            updateToggle(currentConfig.welcomeEnabled);
        }

        function updatePreview() {
            const msg = document.getElementById('welcomeMsg').value || '';
            document.getElementById('previewText').textContent = msg
                .replace('{user}', '@User')
                .replace('{username}', 'User')
                .replace('{server}', 'السيرفر')
                .replace('{count}', '100');
        }

        document.getElementById('welcomeMsg').addEventListener('input', updatePreview);

        async function saveConfig() {
            const config = {
                welcomeChannelId: document.getElementById('channelId').value,
                welcomeMessage: document.getElementById('welcomeMsg').value,
                welcomeEnabled: currentConfig.welcomeEnabled,
                welcomeImage: document.getElementById('welcomeImage').value || null
            };
            try {
                const res = await fetch('/api/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(config)
                });
                if (res.ok) {
                    showToast('✅ تم الحفظ!');
                    currentConfig = { ...currentConfig, ...config };
                }
            } catch (e) { showToast('❌ خطأ'); }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        document.getElementById('tokenInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') startBot();
        });
    </script>
</body>
</html>
