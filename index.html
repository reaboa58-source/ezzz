<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 بوت الترحيب</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        
        .token-box {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            margin-top: 50px;
        }
        .token-box h1 { color: #00ff88; margin-bottom: 10px; }
        .token-box p { color: #888; margin-bottom: 30px; }
        .token-box input {
            width: 100%; padding: 15px; border-radius: 10px;
            border: 2px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.3); color: #fff;
            font-size: 16px; margin-bottom: 15px;
            text-align: center;
        }
        .token-box input:focus { outline: none; border-color: #00ff88; }
        .start-btn {
            width: 100%; padding: 15px;
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            border: none; border-radius: 10px; color: #000;
            font-size: 20px; font-weight: bold; cursor: pointer;
        }
        .start-btn:hover { transform: translateY(-2px); }
        .start-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .error { color: #ff4444; margin-top: 15px; display: none; }
        .loading { color: #00ff88; margin-top: 15px; display: none; }
        .info {
            background: rgba(0,255,136,0.1);
            border-right: 3px solid #00ff88;
            padding: 15px; border-radius: 8px;
            margin-top: 20px; color: #ccc; font-size: 14px;
        }
        
        .dashboard { display: none; }
        h1 { text-align: center; margin-bottom: 30px; color: #00ff88; }
        .card {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #aaa; font-weight: bold; }
        input, textarea {
            width: 100%; padding: 12px; border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.3); color: #fff;
            font-size: 16px; font-family: inherit;
        }
        textarea { min-height: 100px; resize: vertical; }
        .toggle-switch { display: flex; align-items: center; gap: 15px; }
        .switch {
            position: relative; width: 60px; height: 30px;
            background: #444; border-radius: 15px; cursor: pointer; transition: 0.3s;
        }
        .switch.active { background: #00ff88; }
        .switch::after {
            content: ''; position: absolute; width: 26px; height: 26px;
            background: #fff; border-radius: 50%; top: 2px; right: 2px; transition: 0.3s;
        }
        .switch.active::after { right: 32px; }
        .btn {
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            color: #000; border: none; padding: 15px 40px;
            border-radius: 10px; font-size: 18px; font-weight: bold;
            cursor: pointer; width: 100%;
        }
        .btn:hover { transform: translateY(-2px); }
        .status { display: inline-block; padding: 5px 15px; border-radius: 20px; font-size: 14px; font-weight: bold; }
        .status.online { background: #00ff8833; color: #00ff88; }
        .status.offline { background: #ff444433; color: #ff4444; }
        .preview-box {
            background: #36393f; border-radius: 10px;
            padding: 15px; margin-top: 15px; border-left: 4px solid #00ff88;
        }
        .preview-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: #5865f2; }
        .preview-content { color: #dcddde; line-height: 1.5; }
        .variables {
            background: rgba(0,255,136,0.1); border-radius: 8px;
            padding: 15px; margin-top: 15px; font-size: 14px;
        }
        .variables code { background: rgba(0,0,0,0.3); padding: 2px 8px; border-radius: 4px; color: #00ff88; }
        .toast {
            position: fixed; top: 20px; left: 50%;
            transform: translateX(-50%); background: #00ff88;
            color: #000; padding: 15px 30px; border-radius: 10px;
            font-weight: bold; opacity: 0; transition: 0.3s; z-index: 1000;
        }
        .toast.show { opacity: 1; }
        .bot-info { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .bot-avatar {
            width: 50px; height: 50px; border-radius: 50%;
            background: #5865f2; display: flex; align-items: center; justify-content: center; font-size: 24px;
        }
        .change-token {
            background: rgba(255,255,255,0.1); color: #fff;
            border: 1px solid rgba(255,255,255,0.2); padding: 8px 20px;
            border-radius: 8px; cursor: pointer; float: left;
        }
    </style>
</head>
<body>
    <div class="container">
        
        <div class="token-box" id="tokenBox">
            <h1>🤖 بوت الترحيب</h1>
            <p>اكتب توكن البوت واضغط ابدأ</p>
            
            <input type="password" id="tokenInput" placeholder="توكن البوت هنا...">
            <button class="start-btn" id="startBtn" onclick="startBot()">🚀 ابدأ</button>
            
            <div class="error" id="errorBox"></div>
            <div class="loading" id="loadingBox">⏳ جاري التشغيل...</div>
            
            <div class="info">
                <strong>📍 من وين أجيب التوكن؟</strong><br>
                Discord Developer Portal → Bot → Reset Token
            </div>
        </div>

        <div class="dashboard" id="dashboard">
            <h1>⚙️ لوحة التحكم</h1>
            
            <div class="card">
                <div class="bot-info">
                    <div class="bot-avatar">🤖</div>
                    <div>
                        <h3 id="botName">...</h3>
                        <p>الحالة: <span class="status online">🟢 شغال</span></p>
                    </div>
                    <button class="change-token" onclick="changeToken()">🔑 تغيير التوكن</button>
                </div>
            </div>

            <div class="card">
                <h3>⚙️ الإعدادات</h3>
                
                <div class="form-group">
                    <label>التفعيل</label>
                    <div class="toggle-switch">
                        <div class="switch active" id="toggleSwitch" onclick="toggleWelcome()"></div>
                        <span id="toggleText">مفعل</span>
                    </div>
                </div>

                <div class="form-group">
                    <label>ايدي روم الترحيب</label>
                    <input type="text" id="channelId" placeholder="1234567890123456789">
                </div>

                <div class="form-group">
                    <label>رسالة الترحيب</label>
                    <textarea id="welcomeMsg">👋 أهلاً وسهلاً {user} بسيرفرنا!</textarea>
                    
                    <div class="variables">
                        <strong>المتغيرات:</strong>
                        <code>{user}</code> <code>{username}</code> <code>{server}</code> <code>{count}</code>
                    </div>
                </div>

                <div class="form-group">
                    <label>صورة خلفية (اختياري)</label>
                    <input type="text" id="welcomeImage" placeholder="رابط الصورة">
                </div>

                <button class="btn" onclick="saveConfig()">💾 حفظ</button>
            </div>

            <div class="card">
                <h3>👁️ المعاينة</h3>
                <div class="preview-box">
                    <div class="preview-header">
                        <div class="avatar"></div>
                        <div>
                            <div style="color: #fff; font-weight: bold;">بوت الترحيب</div>
                            <div style="color: #72767d; font-size: 12px;">الآن</div>
                        </div>
                    </div>
                    <div class="preview-content" id="previewText">👋 أهلاً وسهلاً @User بسيرفرنا!</div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let currentConfig = {};

        async function startBot() {
            const token = document.getElementById('tokenInput').value.trim();
            const btn = document.getElementById('startBtn');
            const loading = document.getElementById('loadingBox');
            const errorBox = document.getElementById('errorBox');

            if (!token) {
                showError('❌ اكتب التوكن اول!');
                return;
            }

            btn.disabled = true;
            loading.style.display = 'block';
            errorBox.style.display = 'none';

            try {
                const res = await fetch('/api/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token })
                });

                const data = await res.json();

                if (res.ok) {
                    showToast('✅ البوت شغال! ' + data.botTag);
                    showDashboard(data.botTag);
                    loadConfig();
                } else {
                    showError(data.error || '❌ خطأ');
                    btn.disabled = false;
                }
            } catch (e) {
                showError('❌ ما قدرت اتصل بالسيرفر');
                btn.disabled = false;
            } finally {
                loading.style.display = 'none';
            }
        }

        function showDashboard(botTag) {
            document.getElementById('tokenBox').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            document.getElementById('botName').textContent = botTag || 'بوت الترحيب';
        }

        function changeToken() {
            location.reload();
        }

        function showError(msg) {
            const errorBox = document.getElementById('errorBox');
            errorBox.textContent = msg;
            errorBox.style.display = 'block';
        }

        async function loadConfig() {
            try {
                const res = await fetch('/api/config');
                currentConfig = await res.json();
                document.getElementById('channelId').value = currentConfig.welcomeChannelId || '';
                document.getElementById('welcomeMsg').value = currentConfig.welcomeMessage || '';
                document.getElementById('welcomeImage').value = currentConfig.welcomeImage || '';
                updateToggle(currentConfig.welcomeEnabled);
                updatePreview();
            } catch (e) { console.error(e); }
        }

        function updateToggle(enabled) {
            const switchEl = document.getElementById('toggleSwitch');
            const textEl = document.getElementById('toggleText');
            if (enabled) {
                switchEl.classList.add('active');
                textEl.textContent = 'مفعل';
            } else {
                switchEl.classList.remove('active');
                textEl.textContent = 'معطل';
            }
        }

        function toggleWelcome() {
            currentConfig.welcomeEnabled = !currentConfig.welcomeEnabled;
            updateToggle(currentConfig.welcomeEnabled);
        }

        function updatePreview() {
            const msg = document.getElementById('welcomeMsg').value || '';
            document.getElementById('previewText').textContent = msg
                .replace('{user}', '@User')
                .replace('{username}', 'User')
                .replace('{server}', 'السيرفر')
                .replace('{count}', '100');
        }

        document.getElementById('welcomeMsg').addEventListener('input', updatePreview);

        async function saveConfig() {
            const config = {
                welcomeChannelId: document.getElementById('channelId').value,
                welcomeMessage: document.getElementById('welcomeMsg').value,
                welcomeEnabled: currentConfig.welcomeEnabled,
                welcomeImage: document.getElementById('welcomeImage').value || null
            };
            try {
                const res = await fetch('/api/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(config)
                });
                if (res.ok) {
                    showToast('✅ تم الحفظ!');
                    currentConfig = { ...currentConfig, ...config };
                }
            } catch (e) { showToast('❌ خطأ'); }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        document.getElementById('tokenInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') startBot();
        });
    </script>
</body>
</html>
